services:
  - type: web
    name: puente
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/.data
      # Database — set in Render dashboard, linked to the PostgreSQL service below
      - key: DATABASE_URL
        fromDatabase:
          name: puente-db
          property: connectionString
      # Secrets — set in Render dashboard, never committed
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: APP_ACCESS_CODE
        sync: false
      - key: OPERATOR_SECRET
        sync: false
      - key: POLLAR_PUBLISHABLE_KEY
        sync: false
      - key: POLLAR_NETWORK
        value: testnet
      # x402 — OpenZeppelin/Pollar Stellar testnet facilitator
      - key: X402_FACILITATOR_URL
        value: https://channels.openzeppelin.com/x402/testnet
      - key: X402_NETWORK
        value: stellar:testnet
      - key: X402_ASSET_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: X402_ASSET_DECIMALS
        value: "7"
      - key: X402_PAY_TO
        sync: false
      - key: PAYMENT_MODE
        value: live

databases:
  - name: puente-db
    databaseName: puente
    plan: starter
    region: oregon
